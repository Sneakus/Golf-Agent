name: Retrieval eval

# Runs the retrieval eval whenever the corpus, the eval set or the
# retrieval code changes. Fails the build if recall regresses.

on:
  push:
    paths:
      - "*.md"
      - "*.py"
      - ".github/workflows/eval.yml"
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai numpy

      - name: Run retrieval eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python evaluate.py \
            --corpus golf-fault-corpus-v3.md golf-out-of-scope-entries.md \
            --evals golf-eval-sets-v2.md \
            --label "CI run for ${{ github.sha }}" \
            --fail-under-recall5 0.90

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: eval_summary.json
